services:
  # Backend service
  - type: web
    name: skill-sync-backend
    runtime: python
    buildCommand: cd pythonmodel && chmod +x build.sh && ./build.sh
    startCommand: cd pythonmodel && gunicorn job_api.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "skill-sync-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://skill-sync-frontend.onrender.com"
      - key: RAPIDAPI_KEY
        sync: false # set your own key in the Render dashboard - never commit it
      - key: RAPIDAPI_HOST
        value: "jobs-api14.p.rapidapi.com"
      - key: PYTHON_VERSION
        value: 3.13.0

  # Frontend service (static SPA build served with Express)
  - type: web
    name: skill-sync-frontend
    runtime: node
    buildCommand: cd pythonmodel/job-portal-frontend && npm install && npm run build
    startCommand: cd pythonmodel/job-portal-frontend && npm run serve:spa
    envVars:
      - key: NODE_VERSION
        value: 22.0.0
      - key: PORT
        value: 4000
